<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rohan Goswami - Resume</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      height: 100%; 
      width: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #323639; 
    }
    .header {
      height: 52px; 
      background-color: #222527; 
      color: #fff;
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      padding: 0 16px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .title { font-size: 15px; font-weight: 500; }
    .download-btn {
      background-color: #1a73e8; 
      color: white; 
      padding: 8px 16px;
      text-decoration: none; 
      border-radius: 4px; 
      font-size: 14px; 
      font-weight: 500;
      transition: background 0.2s;
    }
    .download-btn:hover { background-color: #1557b0; }
    
    /* Responsive Viewer Container */
    .viewer-container {
      width: 100%;
      height: calc(100% - 52px);
    }
    object {
      width: 100%;
      height: 100%;
    }

    /* Mobile Fallback Card */
    .mobile-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .mobile-fallback h2 { font-size: 20px; margin-bottom: 8px; }
    .mobile-fallback p { font-size: 14px; color: #ccc; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Persistent Header Bar with Download Button -->
  <div class="header">
    <span class="title">Rohan Goswami - Resume</span>
    <a href="RohanGoswamiResume.pdf" download="Rohan_Goswami_Resume.pdf" class="download-btn">
      📥 Download PDF
    </a>
  </div>

  <!-- Smart Viewer -->
  <div class="viewer-container">
    <object data="RohanGoswamiResume.pdf" type="application/pdf">
      <!-- Fallback shown directly inside mobile viewports that block PDF embedding -->
      <div class="mobile-fallback">
        <h2>Rohan Goswami - Resume</h2>
        <p>Tap below to view or save the PDF directly to your device.</p>
        <a href="RohanGoswamiResume.pdf" download="Rohan_Goswami_Resume.pdf" class="download-btn" style="font-size: 16px; padding: 12px 24px;">
          Download / Open Resume PDF
        </a>
      </div>
    </object>
  </div>

</body>
</html>
