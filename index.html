<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rohan Goswami - Resume</title>
  
  <!-- PDF.js CDN Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      height: 100%; 
      width: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #525659; 
    }
    .header {
      height: 50px; 
      background-color: #222527; 
      color: #fff;
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      padding: 0 16px; 
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .title { font-size: 15px; font-weight: 500; }
    .download-btn {
      background-color: #1a73e8; 
      color: white; 
      padding: 7px 14px;
      text-decoration: none; 
      border-radius: 4px; 
      font-size: 13px; 
      font-weight: 500;
    }
    #viewerContainer {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: auto;
    }
    .pdfViewer .page {
      margin: 10px auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="title">Rohan Goswami - Resume</span>
    <a href="RohanGoswamiResume.pdf" download="Rohan_Goswami_Resume.pdf" class="download-btn">
      📥 Download PDF
    </a>
  </div>

  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = 'RohanGoswamiResume.pdf';
    const container = document.getElementById('viewerContainer');
    const eventBus = new pdfjsViewer.EventBus();

    const pdfViewer = new pdfjsViewer.PDFViewer({
      container: container,
      eventBus: eventBus,
      linkService: new pdfjsViewer.PDFLinkService({ eventBus: eventBus }),
    });

    pdfViewer.linkService.setViewer(pdfViewer);

    pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDocument) {
      pdfViewer.setDocument(pdfDocument);
      pdfViewer.linkService.setDocument(pdfDocument, null);
    });
  </script>

</body>
</html>
